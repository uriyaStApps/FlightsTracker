name: Daily flight price fetch

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      destination:
        description: "Single destination to run (leave empty to run all)"
        required: false
        type: choice
        options: ["", "OSL", "YYC", "YVR", "ANC", "ORD"]

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        destination: [OSL, YYC, YVR, ANC, ORD]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scraper/requirements.txt

      - run: python -m playwright install --with-deps chromium

      - if: ${{ github.event.inputs.destination == '' || github.event.inputs.destination == matrix.destination }}
        run: python scraper/fetch_prices.py --destination ${{ matrix.destination }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
